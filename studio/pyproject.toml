[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-gesture-studio"
version = "0.2.0"
description = "Desktop ring gesture recording, training and export platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
  "hmm-gesture==0.2.0",
  "OpenZilo @ git+https://github.com/ziloai/OpenZilo.git@e9a861dd5c82a154fba0f1bafb628cd04fbd9555",
]

[project.scripts]
hmm-gesture-studio = "hmm_gesture_studio.gui:main"
hmm-gesture-train = "hmm_gesture_studio.training:main"

[tool.uv.sources]
hmm-gesture = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
